; GridPilot 5-bay rig firmware
; Board: generic ESP32 DevKit v1 (30 or 38-pin). If your board is different
; (e.g. "esp32-s3-devkitc-1", "esp32-c3-devkitm-1"), change `board` below —
; everything else in this file stays the same.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/Adafruit INA219 @ ^1.2.3

build_flags =
    -D CORE_DEBUG_LEVEL=1
